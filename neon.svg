<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="NEON SIGN" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Anything</title>
  <defs>
    <!-- ▼ 表示テキストはここ1か所を書き換えるだけでOK -->
    <text id="t" x="300" y="88" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="8">Anything</text>

    <radialGradient id="wall" cx="50%" cy="50%" r="80%">
      <stop offset="0" stop-color="#1b0a24"/>
      <stop offset="1" stop-color="#07030b"/>
    </radialGradient>

    <filter id="blurWide" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurMid" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurSoft" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blurTiny" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="600" height="140" rx="10"/></clipPath>
  </defs>

  <style>
    /* 輪郭だけのチューブ（fill=none）で本物のネオン管っぽく */
    .tube { fill:none; stroke-linejoin:round; stroke-linecap:round; }

    /* ぼんやり光る外側のハロー */
    .halo   { animation:haloFlicker 5.3s infinite step-end; }
    /* チューブ本体 */
    .body   { animation:bodyFlicker 5.3s infinite step-end; }
    /* 不具合のある一部（別タイミングで点滅） */
    .glitch { animation:partFlicker 3.7s infinite step-end; }
    /* 枠 */
    .frameN { animation:frameFlicker 7.1s infinite step-end; }
    /* 壁の反射 */
    .wallGlow { animation:wallPulse 5.3s infinite ease-in-out; }

    @keyframes haloFlicker {
      0%{opacity:1} 17%{opacity:0.35} 18%{opacity:1} 19%{opacity:0.2} 20%{opacity:1}
      46%{opacity:0.85} 47%{opacity:1} 71%{opacity:0.3} 72%{opacity:0.9} 73%{opacity:0.25}
      74%{opacity:1} 90%{opacity:0.7} 91%{opacity:1}
    }
    @keyframes bodyFlicker {
      0%{opacity:1} 17%{opacity:0.45} 18%{opacity:1} 19%{opacity:0.3} 20%{opacity:1}
      46%{opacity:0.9} 47%{opacity:1} 71%{opacity:0.4} 72%{opacity:1} 73%{opacity:0.35}
      74%{opacity:1} 90%{opacity:0.8} 91%{opacity:1}
    }
    @keyframes partFlicker {
      0%{opacity:1} 8%{opacity:0.1} 9%{opacity:1} 10%{opacity:0.05} 11%{opacity:0.9}
      12%{opacity:0.1} 14%{opacity:1} 55%{opacity:1} 56%{opacity:0.15} 58%{opacity:1}
      83%{opacity:0.08} 84%{opacity:1} 86%{opacity:0.1} 89%{opacity:1}
    }
    @keyframes frameFlicker {
      0%{opacity:1} 30%{opacity:0.5} 31%{opacity:1} 32%{opacity:0.25} 34%{opacity:1}
      68%{opacity:0.6} 69%{opacity:1}
    }
    @keyframes wallPulse {
      0%{opacity:0.75} 50%{opacity:1} 100%{opacity:0.75}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="600" height="140" fill="url(#wall)"/>

    <!-- レンガ壁っぽい薄いテクスチャ -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <path d="M0 20H600M0 40H600M0 60H600M0 80H600M0 100H600M0 120H600"/>
      <path d="M40 0V20M120 0V20M200 0V20M280 0V20M360 0V20M440 0V20M520 0V20"/>
      <path d="M0 20V40M80 20V40M160 20V40M240 20V40M320 20V40M400 20V40M480 20V40M560 20V40"/>
      <path d="M40 40V60M120 40V60M200 40V60M280 40V60M360 40V60M440 40V60M520 40V60"/>
      <path d="M0 60V80M80 60V80M160 60V80M240 60V80M320 60V80M400 60V80M480 60V80M560 60V80"/>
      <path d="M40 80V100M120 80V100M200 80V100M280 80V100M360 80V100M440 80V100M520 80V100"/>
      <path d="M0 100V120M80 100V120M160 100V120M240 100V120M320 100V120M400 100V120M480 100V120M560 100V120"/>
    </g>

    <!-- 壁に映る光のにじみ -->
    <g class="wallGlow">
      <ellipse cx="300" cy="72" rx="270" ry="55" fill="#ff2e93" opacity="0.14" filter="url(#blurWide)"/>
    </g>

    <!-- ===== ネオン文字 ===== -->
    <!-- ① 周囲のぼんやりした光 -->
    <g class="halo">
      <use xlink:href="#t" href="#t" class="tube" stroke="#ff2e93" stroke-width="14" opacity="0.75" filter="url(#blurWide)"/>
      <use xlink:href="#t" href="#t" class="tube" stroke="#ff2e93" stroke-width="9" opacity="0.85" filter="url(#blurMid)"/>
    </g>

    <!-- ② チューブ本体（色付きガラス） -->
    <g class="body">
      <use xlink:href="#t" href="#t" class="tube" stroke="#ff4fa8" stroke-width="5.5" filter="url(#blurTiny)"/>
      <use xlink:href="#t" href="#t" class="tube" stroke="#ff7cc0" stroke-width="4"/>
    </g>

    <!-- ③ 中心の白熱コア -->
    <g class="body">
      <use xlink:href="#t" href="#t" class="tube" stroke="#ffffff" stroke-width="1.8" filter="url(#blurTiny)" opacity="0.9"/>
      <use xlink:href="#t" href="#t" class="tube" stroke="#fff6fb" stroke-width="1.2"/>
    </g>

    <!-- ④ 不揃いに瞬く“調子の悪い”部分（文字の左端を上から重ねる） -->
    <g class="glitch">
      <clipPath id="partClip"><rect x="90" y="30" width="95" height="75"/></clipPath>
      <g clip-path="url(#partClip)">
        <use xlink:href="#t" href="#t" class="tube" stroke="#ff2e93" stroke-width="12" opacity="0.5" filter="url(#blurMid)"/>
        <use xlink:href="#t" href="#t" class="tube" stroke="#fff6fb" stroke-width="1.4"/>
      </g>
    </g>

    <!-- ===== ネオン枠（シアン） ===== -->
    <g class="frameN">
      <rect x="22" y="18" width="556" height="104" rx="18" class="tube" stroke="#00e5ff" stroke-width="8" opacity="0.6" filter="url(#blurMid)"/>
      <rect x="22" y="18" width="556" height="104" rx="18" class="tube" stroke="#33ecff" stroke-width="3.2" filter="url(#blurTiny)"/>
      <rect x="22" y="18" width="556" height="104" rx="18" class="tube" stroke="#eaffff" stroke-width="1.1"/>
    </g>

    <!-- 固定ブラケット（ネオン管の支え） -->
    <g fill="#2a2a33" stroke="#555" stroke-width="0.6">
      <rect x="20" y="64" width="5" height="12" rx="1"/>
      <rect x="575" y="64" width="5" height="12" rx="1"/>
      <rect x="294" y="16" width="12" height="4" rx="1"/>
      <rect x="294" y="120" width="12" height="4" rx="1"/>
    </g>
  </g>
</svg>
